name: CI/CD Wira Teknik Backend

on:
  push:
    branches:
      - main  # Pipa otomatis berjalan setiap kali Anda push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2204
          script: |
            # 1. Masuk ke folder lokasi backend Anda di VPS
            # Ubah jalur ini jika Anda meletakkannya di folder lain, misal: ~/wira-teknik/backend
            cd ~/server/backend
            
            # 2. Ambil perubahan kode terbaru dari GitHub
            git pull origin main
            
            # 3. Jalankan Docker Compose untuk rebuild aplikasi wira_teknik_api
            # Menggunakan --build agar Docker merekatkan kode Go terbaru ke dalam image
            docker compose up -d --build
            
            # 4. Pembersihan otomatis image yang 'menggantung' (dangling) agar hemat storage VPS
            docker image prune -f
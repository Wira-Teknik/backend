info:
  contact:
    email: admin@wira-teknik.com
    name: Tim Wira Teknik
  description: REST API untuk sistem manajemen Wira Teknik. Mendukung autentikasi,
    manajemen pengguna, dan fitur bisnis lainnya.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Wira Teknik API
  version: "1.0"
paths:
  /attachments:
    post:
      consumes:
      - multipart/form-data
      description: 'Mengunggah file lampiran (image/video/pdf) yang terkait dengan
        resource tertentu. Gunakan form-data dengan field: file, related_id, category.
        Kategori yang tersedia: shipment_delivery, shipment_received, invoice, payment_proof,
        bon, surat_jalan.'
      parameters:
      - description: File yang akan diunggah
        in: formData
        name: file
        required: true
        type: file
      - description: ID resource terkait
        in: formData
        name: related_id
        required: true
        type: string
      - description: Kategori lampiran
        enum:
        - shipment_delivery
        - shipment_received
        - invoice
        - payment_proof
        - bon
        - surat_jalan
        in: formData
        name: category
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Attachment'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Upload lampiran
      tags:
      - Attachments
  /attachments/{relatedId}:
    get:
      description: Mengambil daftar lampiran (foto/video/pdf) yang terkait dengan
        resource tertentu (shipment, invoice, payment, dll)
      parameters:
      - description: Related ID (Shipment ID, Invoice ID, dll)
        in: path
        name: relatedId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Attachment'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Ambil semua lampiran berdasarkan related ID
      tags:
      - Attachments
  /audit:
    get:
      description: Mengambil daftar log audit aktivitas admin. Khusus untuk role owner.
      parameters:
      - description: Cari nama admin
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/services.AuditLogDTO'
                  type: array
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Ambil audit logs
      tags:
      - Audits
  /auth/forgot-password/request:
    post:
      consumes:
      - application/json
      description: Mengirim kode OTP 6 digit ke email pengguna. OTP berlaku 15 menit.
        Response selalu sukses meski email tidak ditemukan (mencegah user enumeration).
      parameters:
      - description: Email terdaftar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.ForgotStep1Request'
      produces:
      - application/json
      responses:
        "200":
          description: OTP dikirim (atau email tidak ditemukan, response tetap sama)
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Format email tidak valid
          schema:
            $ref: '#/definitions/utils.Response'
      summary: Langkah 1 – Request kode OTP
      tags:
      - Auth - Forgot Password
  /auth/forgot-password/reset:
    post:
      consumes:
      - application/json
      description: Mereset password menggunakan token yang didapat dari langkah 2.
        Password baru minimal 8 karakter dan harus mengandung huruf serta angka. Token
        dihapus setelah digunakan (single-use).
      parameters:
      - description: Token verifikasi dan password baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.ForgotStep3Request'
      produces:
      - application/json
      responses:
        "200":
          description: Password berhasil diubah
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Validasi gagal atau token tidak valid/kadaluarsa

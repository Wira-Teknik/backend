  /shipments:
    post:
      consumes:
      - multipart/form-data
      description: Membuat pengiriman baru dari order. Jumlah kirim tidak boleh melebihi
        sisa qty. Invoice otomatis di-generate. Status order diperbarui otomatis (partial/shipped).
      parameters:
      - description: Order ID
        in: formData
        name: order_id
        required: true
        type: string
      - description: Shipping Date (YYYY-MM-DD)
        in: formData
        name: shipping_date
        required: true
        type: string
      - description: JSON string of array of items e.g. [{'order_item_id':'...', 'shipping_qty':50}]
        in: formData
        name: items
        required: true
        type: string
      - description: File Bukti Kirim
        in: formData
        name: bukti_kirim
        required: true
        type: file
      - description: File Surat Jalan
        in: formData
        name: surat_jalan
        required: true
        type: file
      - description: File Bon Pesanan
        in: formData
        name: bon_pesanan
        required: true
        type: file
      - description: File Invoice
        in: formData
        name: invoice_file
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Shipment'
              type: object
        "400":
          description: Bad Request
          schema:

        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.PaginatedPaymentsResponse'
      security:
      - BearerAuth: []
      summary: Ambil daftar pembayaran & tagihan customer
      tags:
      - Payments
    post:
      consumes:
      - multipart/form-data
      description: Membuat pembayaran baru dengan alokasi otomatis berdasarkan daftar
        Order ID dari tagihan yang terlama. File bukti bayar dapat diunggah secara
        terpisah melalui API Attachments.
      parameters:
      - description: Payment Date (YYYY-MM-DD)
        in: formData
        name: payment_date
        required: true
        type: string
      - description: Total transfer amount (untuk auto-allocation via order_id)
        in: formData
        name: payment_total
        required: true
        type: number
      - description: 'JSON string of array of details e.g. [ { ''''order_id'''': ''''uuid''''
          } ] (NOTE: Ganti '''' dengan tanda kutip dua)'
        in: formData
        name: details
        required: true
        type: string
      - description: File Bukti Pembayaran
        in: formData
        name: bukti_bayar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Payment'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Buat pembayaran baru
      tags:
      - Payments
  /payments/{id}:
    get:
      description: Mengambil detail pembayaran termasuk detail alokasi ke invoice
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Payment'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Ambil detail pembayaran
      tags:
      - Payments
    put:
      consumes:
      - application/json
      description: Memperbarui jumlah total pembayaran (payment_total) dan secara
        otomatis mengalokasikan ulang sisa saldo ke invoice yang bersangkutan secara
        kronologis.
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      - description: Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.UpdatePaymentTotalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Payment'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Edit total pembayaran
      tags:
      - Payments
  /payments/customer/{name}:
    get:
      description: Mengambil detail ringkasan keuangan dan riwayat pembayaran lengkap
        dari satu customer tertentu berdasarkan namanya. Mendukung filter nomor PO/transaksi,
        status pembayaran (all, paid, partial, unpaid), dan rentang tanggal order_date.
      parameters:
      - description: Customer Name
        in: path
        name: name
        required: true
        type: string
      - description: Cari nomor PO atau Transaksi
        in: query
        name: po_no
        type: string
      - description: Filter status (all, paid, partial, unpaid)
        in: query
        name: status
        type: string
      - description: Tanggal awal filter (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Tanggal akhir filter (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/services.CustomerPaymentDetailResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Ambil detail pembayaran customer dengan filter
      tags:
      - Payments
  /payments/history:
    get:
      description: Mengambil riwayat cicilan transaksi pembayaran dengan pencarian
        berdasarkan PO atau nomor transaksi, filter berdasarkan status pembayaran
        order terkait (all, paid, partial), rentang tanggal payments.payment_date,
        dan pagination (page & limit).
      parameters:
      - description: Cari nomor PO atau transaksi
        in: query
        name: search
        type: string
      - description: Filter status (all, paid, partial)
        in: query
        name: status
        type: string
      - description: Tanggal awal filter (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Tanggal akhir filter (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: 'Halaman aktif (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah baris per halaman (default: 20)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.PaginatedPaymentHistoryResponse'
      security:
      - BearerAuth: []
      summary: Ambil Laporan Riwayat Transaksi Pembayaran
      tags:
      - Payments
  /payments/history/export:
    get:
      description: Mengunduh file Excel atau PDF berisi riwayat alokasi cicilan pembayaran
        berdasarkan filter pencarian, status pembayaran order terkait, rentang tanggal
        payments.payment_date, dan parameter format (excel/pdf).
      parameters:
      - description: Cari nomor PO atau transaksi
        in: query
        name: search
        type: string
      - description: Filter status (all, paid, partial)
        in: query
        name: status
        type: string
      - description: Tanggal awal filter (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Tanggal akhir filter (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: 'Format dokumen (excel/pdf, default: excel)'
        in: query
        name: format
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: File Dokumen
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Export Riwayat Pembayaran ke Excel / PDF
      tags:
      - Payments
  /shipments:
    post:
      consumes:
      - multipart/form-data
      description: Membuat pengiriman baru dari order. Jumlah kirim tidak boleh melebihi
        sisa qty. Invoice otomatis di-generate. Status order diperbarui otomatis (partial/shipped).
      parameters:
      - description: Order ID
        in: formData
        name: order_id
        required: true
        type: string
      - description: Shipping Date (YYYY-MM-DD)
        in: formData
        name: shipping_date
        required: true
        type: string
      - description: JSON string of array of items e.g. [{'order_item_id':'...', 'shipping_qty':50}]
        in: formData
        name: items
        required: true
        type: string
      - description: File Bukti Kirim
        in: formData
        name: bukti_kirim
        required: true
        type: file
      - description: File Surat Jalan
        in: formData
        name: surat_jalan
        required: true
        type: file
      - description: File Bon Pesanan
        in: formData
        name: bon_pesanan
        required: true
        type: file
      - description: File Invoice
        in: formData
        name: invoice_file
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Shipment'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Buat pengiriman baru (partial shipment)
      tags:
      - Shipments
  /shipments/{id}:
    get:
      description: Mengambil detail pengiriman termasuk item-itemnya (tanpa created_at
        & updated_at)
      parameters:
      - description: Shipment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.ShipmentResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Ambil detail pengiriman
      tags:
      - Shipments
    put:
      consumes:
      - application/json
      description: Memperbarui daftar item dan kuantitas barang pada pengiriman yang
        sudah dibuat. Menghitung ulang remaining_qty pesanan dan nominal invoice secara
        otomatis.
      parameters:
      - description: Shipment ID
        in: path
        name: id
        required: true
        type: string
      - description: Data item pengiriman
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.UpdateShipmentItemsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.ShipmentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Edit kuantitas barang dikirim
      tags:
      - Shipments
  /shipments/{id}/received:
    patch:
      description: Mengubah status pengiriman menjadi 'diterima' dan mencatat tanggal
        penerimaan (tanpa created_at & updated_at). Jika semua item terkirim dan semua
        shipment diterima, status order menjadi 'completed'.
      parameters:
      - description: Shipment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/controllers.ShipmentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Konfirmasi penerimaan barang
      tags:
      - Shipments
  /shipments/{shipmentId}/invoice:
    get:
      description: Mengambil invoice yang terkait dengan pengiriman tertentu
      parameters:
      - description: Shipment ID
        in: path
        name: shipmentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Invoice'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Ambil invoice berdasarkan Shipment
      tags:
      - Shipments
securityDefinitions:
  BearerAuth:
    description: 'Masukkan token dengan format: **Bearer &lt;token&gt;**'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
